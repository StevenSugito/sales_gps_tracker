name: sales_gps_tracker
description: Aplikasi tracking kunjungan sales dengan GPS dan kamera

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  geolocator: ^10.1.0
  camera: ^0.10.5+9
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.0
  share_plus: ^10.0.0    # ← GANTI DARI ^7.2.1
  csv: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true